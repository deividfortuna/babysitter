# GoReleaser configuration. The SQLite driver uses cgo, so every target
# needs a C cross compiler. The release workflow runs GoReleaser inside the
# goreleaser-cross image, which ships the compilers named below.
version: 2

project_name: babysitter

before:
  hooks:
    - go -C backend mod tidy
    - go -C backend test ./...

builds:
  - id: linux-amd64
    dir: backend
    main: ./cmd/babysitter
    binary: babysitter
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

  - id: linux-arm64
    dir: backend
    main: ./cmd/babysitter
    binary: babysitter
    goos: [linux]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

  - id: darwin-amd64
    dir: backend
    main: ./cmd/babysitter
    binary: babysitter
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

  - id: darwin-arm64
    dir: backend
    main: ./cmd/babysitter
    binary: babysitter
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  disable: true
