version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - unconvert
    - usetesting
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
    gosec:
      excludes:
        - G104
        - G204
    revive:
      rules:
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
      - path: internal/store/
        linters:
          - gosec
        text: G202
      - path: internal/store/store_test\.go
        linters:
          - gocritic
        text: mapKey
      - path: cmd/genspec/main\.go
        linters:
          - gosec
        text: G306
      - path: internal/agent/copilot/hooks\.go
        linters:
          - gosec
        text: G306|G703
      - path: internal/agent/(tools|credentials)\.go
        linters:
          - gosec
        text: G306
      - path: internal/service/service\.go
        linters:
          - gosec
        text: G30[16]

formatters:
  enable:
    - gofumpt
    - goimports
