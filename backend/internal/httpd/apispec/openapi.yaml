openapi: 3.0.3
info:
  description: Loopback API of the babysitter daemon. Generated from the Go types
    in internal/httpd; do not edit by hand.
  title: babysitter daemon API
  version: 1.0.0
servers:
- url: http://127.0.0.1:{port}/api/v1
  variables:
    port:
      default: "0"
paths:
  /api/v1/control/shutdown:
    post:
      operationId: shutdown
      responses:
        "202":
          description: Accepted
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Stop the daemon. Rejected for browser origins.
  /api/v1/events:
    get:
      operationId: streamEvents
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Change feed as server-sent events
  /api/v1/healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdHealth'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Liveness of the daemon
  /api/v1/logs:
    get:
      operationId: listLogs
      parameters:
      - description: Only records with a seq above this
        in: query
        name: after
        schema:
          description: Only records with a seq above this
          format: int64
          type: integer
      - description: At most this many records from the end, from 0 for all to 100000,
          default 500
        in: query
        name: limit
        schema:
          description: At most this many records from the end, from 0 for all to 100000,
            default 500
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdLogList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: The last records the daemon logged in this run, oldest first
  /api/v1/logs/level:
    get:
      operationId: getLogLevel
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdLogLevel'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: The lowest level the daemon records
    put:
      operationId: putLogLevel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpdLogLevel'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdLogLevel'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: Change the lowest level the daemon records until it stops
  /api/v1/logs/stream:
    get:
      operationId: streamLogs
      parameters:
      - description: Send the kept records with a seq above this first, then each
          new one
        in: query
        name: after
        schema:
          description: Send the kept records with a seq above this first, then each
            new one
          format: int64
          type: integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: 'The log of the daemon as server-sent events: a ready frame, the kept
        records after the seq, then one log frame per new record'
  /api/v1/notifications:
    get:
      operationId: listNotifications
      parameters:
      - description: all (default) or unread
        in: query
        name: status
        schema:
          description: all (default) or unread
          enum:
          - all
          - unread
          type: string
      - description: 'How many rows at most: 1 to 1000, 200 by default'
        in: query
        name: limit
        schema:
          description: 'How many rows at most: 1 to 1000, 200 by default'
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdNotificationList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: The notifications the daemon recorded, newest first
    post:
      operationId: addNotification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpdNewNotificationRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdNotification'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: Record one notification and show it
  /api/v1/notifications/read:
    post:
      operationId: readNotifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpdReadNotificationsRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdNotificationsRead'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Mark notifications as seen; no ids marks every unread one
  /api/v1/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdProviderList'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: The AI providers and the models they offer
  /api/v1/prs:
    get:
      operationId: listPullRequests
      parameters:
      - description: Only one repository, as owner/name
        in: query
        name: repo
        schema:
          description: Only one repository, as owner/name
          type: string
      - description: open (default) or all
        in: query
        name: state
        schema:
          description: open (default) or all
          enum:
          - open
          - all
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdPullRequestList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: List the stored pull requests
  /api/v1/ratelimit:
    get:
      operationId: getRateLimit
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdRateLimit'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: The GitHub API budget the token of the daemon has left
  /api/v1/readyz:
    get:
      operationId: getReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdHealth'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Readiness of the daemon
  /api/v1/repos:
    get:
      operationId: listRepos
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdRepoList'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: List the watched repositories
    post:
      operationId: addRepo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpdAddRepoRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdRepo'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Watch a repository
  /api/v1/repos/{id}:
    delete:
      operationId: removeRepo
      parameters:
      - description: Repository id
        in: path
        name: id
        required: true
        schema:
          description: Repository id
          format: int64
          type: integer
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Stop watching a repository
  /api/v1/repos/{id}/config:
    get:
      operationId: getRepoConfig
      parameters:
      - description: Repository id
        in: path
        name: id
        required: true
        schema:
          description: Repository id
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdRepoConfig'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: What babysitter does with the new pull requests of a repository
    patch:
      operationId: updateRepoConfig
      parameters:
      - description: Repository id
        in: path
        name: id
        required: true
        schema:
          description: Repository id
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepoConfigParams'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdRepoConfig'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Change the configuration of a repository. A toggle that goes on records
        the time; only pull requests created from then on start.
  /api/v1/repos/{id}/queue:
    get:
      operationId: getRepoQueue
      parameters:
      - description: Repository id
        in: path
        name: id
        required: true
        schema:
          description: Repository id
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdRepoQueue'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: The Dependabot pull requests that wait for a place, oldest first
  /api/v1/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdSettings'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: The settings of the daemon
    put:
      operationId: putSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpdSettings'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdSettings'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Write the settings of the daemon
  /api/v1/sync:
    post:
      operationId: requestSync
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdSyncAccepted'
          description: Accepted
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Ask the watcher for a sync pass now
  /api/v1/viewer:
    get:
      operationId: getViewer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdViewer'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: The GitHub account the daemon acts as
  /api/v1/watches:
    get:
      operationId: listWatches
      parameters:
      - description: active (default) or all
        in: query
        name: status
        schema:
          description: active (default) or all
          enum:
          - active
          - all
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdWatchList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: List the watched pull requests
    post:
      operationId: startWatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpdStartWatchRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdWatch'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: Watch a pull request
  /api/v1/watches/{id}:
    get:
      operationId: getWatch
      parameters:
      - description: Watch id
        in: path
        name: id
        required: true
        schema:
          description: Watch id
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdWatch'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: One watched pull request
    patch:
      operationId: updateWatch
      parameters:
      - description: Watch id
        in: path
        name: id
        required: true
        schema:
          description: Watch id
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWatchParams'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdWatch'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: Change the approvals, the merge method and merge when ready of a watch
        while it runs. The other fields of a watch cannot change.
  /api/v1/watches/{id}/activity:
    get:
      operationId: listWatchActivity
      parameters:
      - description: Only rows with an id above this
        in: query
        name: since
        schema:
          description: Only rows with an id above this
          format: int64
          type: integer
      - description: At most this many rows, default 200
        in: query
        name: limit
        schema:
          description: At most this many rows, default 200
          type: integer
      - description: Watch id
        in: path
        name: id
        required: true
        schema:
          description: Watch id
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdActivityList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
      summary: Activity of a watched pull request
  /api/v1/watches/{id}/approval:
    post:
      operationId: setWatchApproval
      parameters:
      - description: Watch id
        in: path
        name: id
        required: true
        schema:
          description: Watch id
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalParams'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdWatch'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: Change who releases the turns of a watch while it runs
  /api/v1/watches/{id}/handback:
    post:
      operationId: handbackWatch
      parameters:
      - description: Watch id
        in: path
        name: id
        required: true
        schema:
          description: Watch id
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandbackParams'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdWatch'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdHandbackRefusal'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Service Unavailable
      summary: Give the agent session of a watch back to the daemon. A 409 with the
        code unconfirmed_work lists the commits and the changes to confirm.
  /api/v1/watches/{id}/hook:
    post:
      operationId: reportWatchHook
      parameters:
      - description: Watch id
        in: path
        name: id
        required: true
        schema:
          description: Watch id
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookParams'
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpdAPIError'
          description: Bad Request
