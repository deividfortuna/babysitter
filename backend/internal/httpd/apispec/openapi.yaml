components:
  schemas:
    ApprovalParams:
      properties:
        autoApproveRebase:
          nullable: true
          type: boolean
        mode:
          enum:
          - auto
          - manual
          nullable: true
          type: string
        release:
          description: Confirm that a switch to auto releases the proposal that waits
            on the author
          type: boolean
      type: object
    ApproveParams:
      properties:
        drop:
          description: The ids of the replies the author took out
          items:
            format: int64
            type: integer
          type: array
        edits:
          description: The replies the author rewrote
          items:
            $ref: '#/components/schemas/HttpdReplyEdit'
          type: array
        rejectPush:
          description: Post the replies without pushing the commits
          type: boolean
        stopAsking:
          description: Release the proposal and set the watch to auto
          type: boolean
      type: object
    HandbackParams:
      properties:
        confirm:
          description: Hand back although the worktree has commits or changes that
            are not on the pull request
          type: boolean
        force:
          description: Hand back although the process that took the session still
            runs
          type: boolean
      type: object
    HookParams:
      properties:
        event:
          enum:
          - session-start
          - user-prompt-submit
          - pre-tool-use
          - post-tool-use
          - post-tool-use-failure
          - permission-request
          - stop
          - notification
          - session-end
          type: string
        payload:
          additionalProperties: {}
          nullable: true
          type: object
      required:
      - event
      - payload
      type: object
    HttpdAPIError:
      properties:
        error:
          $ref: '#/components/schemas/HttpdErrorBody'
      required:
      - error
      type: object
    HttpdActivity:
      properties:
        actor:
          type: string
        at:
          format: date-time
          type: string
        id:
          format: int64
          type: integer
        kind:
          enum:
          - comment
          - review_comment
          - review
          - check_failed
          - check_recovered
          - checks_green
          - commit
          - behind
          - conflict
          - merged
          - closed
          - heartbeat
          - watch_started
          - watch_stopped
          - session_started
          - session_exited
          - nudged
          - agent_failed
          - merge_ready
          - merge_failed
          - replied
          - review_requested
          - proposal
          - taken_over
          - handed_back
          - auto_started
          - approved
          - approval_asked
          type: string
        nudgedAt:
          description: When the row reached the agent
          format: date-time
          nullable: true
          type: string
        payload:
          additionalProperties: {}
          nullable: true
          type: object
        ref:
          type: string
        reported:
          type: boolean
        reportedAt:
          format: date-time
          nullable: true
          type: string
        summary:
          type: string
        url:
          type: string
        watchId:
          format: int64
          type: integer
      required:
      - id
      - watchId
      - kind
      - ref
      - at
      - actor
      - summary
      - url
      - payload
      - reported
      type: object
    HttpdActivityList:
      properties:
        activity:
          items:
            $ref: '#/components/schemas/HttpdActivity'
          nullable: true
          type: array
      required:
      - activity
      type: object
    HttpdAddRepoRequest:
      properties:
        fullName:
          type: string
      required:
      - fullName
      type: object
    HttpdErrorBody:
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
      type: object
    HttpdHandbackRefusal:
      properties:
        commits:
          description: The commits of the work branch that the pull request branch
            does not have; present with the code unconfirmed_work
          items:
            $ref: '#/components/schemas/HttpdWorkCommit'
          type: array
        error:
          $ref: '#/components/schemas/HttpdErrorBody'
        files:
          description: The changes of the worktree that are not committed, as git
            status --porcelain prints them; present with the code unconfirmed_work
          items:
            type: string
          type: array
      required:
      - error
      type: object
    HttpdHealth:
      properties:
        pid:
          type: integer
        startedAt:
          type: string
        status:
          type: string
        version:
          type: string
      required:
      - status
      - version
      - pid
      - startedAt
      type: object
    HttpdLogAttr:
      properties:
        key:
          type: string
        value:
          type: string
      required:
      - key
      - value
      type: object
    HttpdLogLevel:
      properties:
        level:
          description: The lowest level the daemon records. It holds until the daemon
            stops.
          enum:
          - debug
          - info
          - warn
          - error
          type: string
      required:
      - level
      type: object
    HttpdLogList:
      properties:
        path:
          description: The file the daemon writes its log to; empty when it writes
            none
          type: string
        records:
          description: Oldest first
          items:
            $ref: '#/components/schemas/HttpdLogRecord'
          nullable: true
          type: array
      required:
      - records
      - path
      type: object
    HttpdLogRecord:
      properties:
        attrs:
          description: The attributes of the record in the order the code gave them;
            a group joins its keys with a dot
          items:
            $ref: '#/components/schemas/HttpdLogAttr'
          nullable: true
          type: array
        level:
          enum:
          - debug
