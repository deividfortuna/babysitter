            calls it ready to merge
          type: integer
        author:
          type: string
        autoApproveRebase:
          description: Approved work goes out after a clean rebase without asking
            again
          type: boolean
        autoReason:
          description: 'Why auto start began the watch: the author opened the pull
            request, it is assigned to the author, or Dependabot opened it; absent
            for a watch started by hand'
          enum:
          - ""
          - mine
          - assigned
          - dependabot
          type: string
        baseRef:
          type: string
        checkStates:
          additionalProperties:
            type: string
          nullable: true
          type: object
        dependabot:
          description: Dependabot owns the branch of the pull request, so the daemon
            never pushes it and the agent only replies
          type: boolean
        greenSha:
          type: string
        headRef:
          type: string
        headSha:
          type: string
        id:
          format: int64
          type: integer
        includeExisting:
          type: boolean
        includeOwn:
          type: boolean
        keepWorktree:
          description: A stop leaves the worktree of the watch on disk unless the
            stop says otherwise
          type: boolean
        lastError:
          type: string
        lastHeartbeatAt:
          format: date-time
          nullable: true
          type: string
        lastPollAt:
          format: date-time
          nullable: true
          type: string
        mergeMethod:
          description: The merge method of the watch; empty takes the first one the
            repository allows
          enum:
          - ""
          - squash
          - merge
          - rebase
          type: string
        mergeWhenReady:
          description: The daemon merges with the method of the watch as soon as the
            watch is ready to merge
          type: boolean
        mergeableState:
          type: string
        model:
          type: string
        number:
          type: integer
        pendingProposal:
          description: The number of the proposal that waits on the author, absent
            when none waits
          type: integer
        prState:
          type: string
        provider:
          description: The AI provider of the agent session the daemon runs; self
            means the session that started the watch is its agent and takes each message
            with the next route
          enum:
          - claude
          - copilot
          - self
          type: string
        readyBlockers:
          description: What keeps the pull request from merging, one sentence each
          items:
            type: string
          nullable: true
          type: array
        readySince:
          description: Since when the pull request is ready to merge; absent while
            something blocks it, and until the readiness stood a whole poll interval
          format: date-time
          nullable: true
          type: string
        repo:
          type: string
        session:
          $ref: '#/components/schemas/HttpdSession'
        sourceDir:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          enum:
          - active
          - stopped
          type: string
        stopReason:
          enum:
          - ""
          - user
          - merged
          - closed
          - lost_access
          - error
          type: string
        stoppedAt:
          format: date-time
          nullable: true
          type: string
        summary:
          $ref: '#/components/schemas/HttpdWatchSummary'
        takenOverAt:
          description: Since when the session is with the author in their terminal;
            absent while the daemon has it
          format: date-time
          nullable: true
          type: string
        title:
          type: string
        updateType:
          description: The highest update of a Dependabot pull request; a type the
            daemon cannot read counts as major
          enum:
          - ""
          - patch
          - minor
          - major
          type: string
        url:
          type: string
        workBranch:
          description: The private branch of the watch in its worktree
          type: string
        worktreeDir:
          type: string
      required:
      - id
      - repo
      - number
      - url
      - title
      - author
      - dependabot
      - headRef
      - baseRef
      - provider
      - model
      - sourceDir
      - worktreeDir
      - workBranch
      - status
      - stopReason
      - includeExisting
      - includeOwn
      - startedAt
      - lastError
      - headSha
      - prState
      - mergeableState
      - checkStates
      - greenSha
      - agentSession
      - approvalsRequired
      - mergeMethod
      - readyBlockers
      - approvalMode
      - autoApproveRebase
      - mergeWhenReady
      - keepWorktree
      - session
      type: object
    HttpdWatchList:
      properties:
        watches:
          items:
            $ref: '#/components/schemas/HttpdWatch'
          nullable: true
          type: array
      required:
      - watches
      type: object
    HttpdWatchOverrides:
      properties:
        approvalMode:
          description: Who releases the work of a turn of the agent; empty takes the
            setting of the daemon
          enum:
          - ""
          - auto
          - manual
          type: string
        approvalsRequired:
          description: How many approvals the pull request needs; absent takes the
            setting of the daemon, 0 asks for none, and null asks for the rule of
            the base branch
          minimum: 0
          nullable: true
          type: integer
        autoApproveRebase:
          description: Approved work goes out after a clean rebase without asking
            again; absent takes the setting of the daemon
          nullable: true
          type: boolean
        includeExisting:
          description: Report the review items the pull request has already; absent
            takes the setting of the daemon
          nullable: true
          type: boolean
        includeOwn:
          description: Report the comments of the token's own user; absent takes the
            setting of the daemon
          nullable: true
          type: boolean
        keepWorktree:
          description: A stop leaves the worktree of the watch on disk; absent takes
            the setting of the daemon
          nullable: true
          type: boolean
        mergeMethod:
          description: The merge method of the watches; empty takes the setting of
            the daemon
          enum:
          - ""
          - squash
          - merge
          - rebase
          type: string
        model:
          description: The model of that provider; empty takes the default of the
            provider. Needs a provider
          type: string
        provider:
          description: The AI provider of a watch on the repository; empty takes the
            provider of the daemon
          enum:
          - ""
          - claude
          - copilot
          type: string
      required:
      - provider
      - model
      - approvalMode
      - mergeMethod
      type: object
    HttpdWatchSummary:
      properties:
        activity:
          additionalProperties:
            type: integer
          nullable: true
          type: object
        checks:
          type: string
        detail:
          type: string
        headSha:
          type: string
        mergeableState:
          type: string
        messages:
          description: How many messages the agent got
          type: integer
        prState:
          type: string
        reason:
          type: string
        workBranchLeft:
          description: The private branch of the watch that stayed in the checkout
            of the author
          type: string
        worktreeRemoved:
          description: The stop deleted the worktree of the watch
          type: boolean
      required:
      - prState
      - headSha
      - checks
      - mergeableState
      - activity
      - messages
      - reason
      - worktreeRemoved
      type: object
    HttpdWorkCommit:
      properties:
        sha:
          type: string
        subject:
          type: string
      required:
      - sha
      - subject
      type: object
    MergeWatchParams:
      properties:
        approve:
          description: Approve the Dependabot update in the name of the author before
            the merge. The daemon refuses a pull request that is not of Dependabot
            or an update outside the merge scope of the repository
          type: boolean
        method:
          description: The merge method for this merge; empty takes the method of
            the watch
          enum:
          - ""
          - squash
          - merge
          - rebase
          type: string
      type: object
    RejectParams:
      properties:
        discard:
          description: Reset the work branch to the head the turn started on, whatever
            the setting of the worktree says
          type: boolean
        reason:
          description: What the agent should do instead; it works on it
          type: string
      type: object
    ReplyParams:
      properties:
        body:
          type: string
        inReplyTo:
          description: 'The comment the reply answers: a review comment, in its thread,
            or a comment on the conversation, on the conversation; absent posts a
            comment on the pull request'
          format: int64
          type: integer
      required:
      - body
      type: object
    RepoConfigParams:
      properties:
        autoStartMine:
          nullable: true
          type: boolean
        autoWatchDependabot:
          nullable: true
          type: boolean
        checkoutDir:
          description: A git checkout whose origin is the repository; empty clears
            it
          nullable: true
          type: string
        dependabotApproval:
          enum:
          - never
          - ask
          - green
          nullable: true
          type: string
        dependabotLimit:
          minimum: 1
          nullable: true
          type: integer
        dependabotScope:
          enum:
          - patch
          - minor
          - major
          nullable: true
          type: string
        includeDrafts:
          nullable: true
          type: boolean
        overrides:
          $ref: '#/components/schemas/HttpdWatchOverrides'
      type: object
    ResizeParams:
      properties:
        cols:
          description: Columns of the terminal of the agent, 1 to 1000
          maximum: 1000
          minimum: 1
          type: integer
        rows:
          description: Rows of the terminal of the agent, 1 to 500
          maximum: 500
          minimum: 1
          type: integer
      required:
      - rows
      - cols
      type: object
    SendParams:
      properties:
        message:
          type: string
      required:
      - message
      type: object
    StopWatchParams:
      properties:
        keepWorktree:
          description: Leave the worktree of the watch on disk instead of deleting
            it; absent takes the rule the watch started with
          nullable: true
          type: boolean
      type: object
    TakeoverParams:
      properties:
        pid:
          description: The pid of the process that takes the session; the hand-back
            waits until it ends
          type: integer
        shell:
          description: The author runs a shell in the worktree and not the agent,
            so a watch with no conversation keeps none
          type: boolean
      required:
      - pid
      type: object
    UpdateWatchParams:
      properties:
        approvalsRequired:
          description: How many approvals the pull request needs before the watch
            calls it ready to merge; absent keeps what the watch has, 0 asks for none,
            and null reads the rule of the base branch again
          minimum: 0
          nullable: true
          type: integer
        mergeMethod:
          description: 'The merge method of the watch: squash, merge, rebase, or empty
            for the first method the repository allows; absent keeps what the watch
            has'
          enum:
          - ""
          - squash
          - merge
          - rebase
          nullable: true
          type: string
        mergeWhenReady:
          description: The daemon merges as soon as the watch is ready to merge; absent
            keeps what the watch has
          nullable: true
          type: boolean
      type: object
