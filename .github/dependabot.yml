version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      electron-forge:
        patterns:
          - "@electron-forge/*"
          - "@electron/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - prettier-plugin-tailwindcss
          - eslint-plugin-better-tailwindcss
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      lint-and-format:
        patterns:
          - oxlint
          - oxlint-tsgolint
          - prettier
          - "@shadcn/lint"
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /codegen
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    versioning-strategy: increase
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      codegen:
        patterns:
          - "*"
