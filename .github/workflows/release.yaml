name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        default: preview
        options:
          - preview
          - nightly
          - stable
      version:
        description: Stable version, such as 1.2.3. The default is the version that the latest nightly previews
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly' || inputs.channel == 'preview') && 'nightly' || 'stable' }}
  cancel-in-progress: false

env:
  GORELEASER_CROSS_VERSION: v1.27.1

jobs:
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      name: ${{ steps.plan.outputs.name }}
      ref: ${{ steps.plan.outputs.ref }}
      latest: ${{ steps.plan.outputs.latest }}
      feed: ${{ steps.plan.outputs.feed }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Plan the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: node frontend/scripts/resolve-release.mjs

  cli:
    name: CLI
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag the commit
        run: git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || git tag "$TAG"

      - name: Build
        run: |
          docker run --rm \
            -v "$PWD:/go/src/babysitter" \
            -w /go/src/babysitter \
            -e GORELEASER_CURRENT_TAG="$TAG" \
            "ghcr.io/goreleaser/goreleaser-cross:${GORELEASER_CROSS_VERSION}" \
            release --clean --skip=publish

      - name: Upload the archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli
          path: |
            dist/*.tar.gz
            dist/checksums.txt

  desktop:
    name: Desktop (${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            lipo: arm64
          - runner: macos-15-intel
            arch: x64
            lipo: x86_64
    defaults:
      run:
        working-directory: frontend
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.resolve.outputs.version }}
      BABYSITTER_RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
      SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      UPDATES: ${{ secrets.MAC_CERT_P12_BASE64 != '' && needs.resolve.outputs.feed != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Set the version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Import the signing certificate
        if: env.SIGNED == 'true'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Choose the signature
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "BABYSITTER_ADHOC_SIGN=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BABYSITTER_SIGN_IDENTITY=$MAC_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
            {
              echo "APPLE_API_KEY=$key"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      - name: Make
        run: |
          for attempt in 1 2 3; do
            npm run make -- --arch="$ARCH" && exit 0
            echo "::warning::make failed on attempt $attempt"
            sleep 30
          done
          exit 1

      - name: Verify the app
        env:
          LIPO_ARCH: ${{ matrix.lipo }}
        run: |
          app="out/Babysitter-darwin-$ARCH/Babysitter.app"
          daemon="$app/Contents/Resources/daemon/babysitter"
          if [ ! -d "$app" ]; then
            echo "::error::make wrote no app at $app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$daemon")" = "$LIPO_ARCH"
          test "$("$daemon" --version)" = "babysitter version $VERSION"
          if [ "$SIGNED" = "true" ]; then
            spctl --assess --verbose=2 --type execute "$app"
            xcrun stapler validate "$app"
          fi
          if [ "$UPDATES" = "true" ]; then
            test -f "$app/Contents/Resources/app-update.yml"
          else
            test ! -f "$app/Contents/Resources/app-update.yml"
          fi

      - name: Name the assets
        run: |
          mkdir -p out/release
          cp "out/make/dmg/$ARCH/Babysitter.dmg" "out/release/Babysitter-$VERSION-darwin-$ARCH.dmg"
          cp "out/make/zip/darwin/$ARCH/Babysitter-darwin-$ARCH-$VERSION.zip" "out/release/Babysitter-$VERSION-darwin-$ARCH.zip"
          cp "out/release/Babysitter-$VERSION-darwin-$ARCH.dmg" "out/release/babysitter-darwin-$ARCH.dmg"
          cp "out/release/Babysitter-$VERSION-darwin-$ARCH.zip" "out/release/babysitter-darwin-$ARCH.zip"
          ls -l out/release

      - name: Upload the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.arch }}
          path: frontend/out/release/*

  publish:
    name: Publish
    needs: [resolve, cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.resolve.outputs.channel }}
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      NAME: ${{ needs.resolve.outputs.name }}
      REF: ${{ needs.resolve.outputs.ref }}
      LATEST: ${{ needs.resolve.outputs.latest }}
      FEED: ${{ needs.resolve.outputs.feed }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
      UPDATES: ${{ secrets.MAC_CERT_P12_BASE64 != '' && needs.resolve.outputs.feed != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Download the assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true

      - name: Write the feed
        if: env.UPDATES == 'true'
        run: |
          node frontend/scripts/write-feed.mjs "$VERSION" \
            "assets/Babysitter-$VERSION-darwin-arm64.zip" \
            "assets/Babysitter-$VERSION-darwin-x64.zip" > "assets/$FEED"
          cat "assets/$FEED"

      - name: Write the notes of a preview
        if: env.CHANNEL == 'preview'
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          > [!WARNING]
          > **This is a preview build. Do not install it unless you know why you are here.**
          >
          > A maintainer makes a preview from a branch to test the release. It can be broken, it gets no fixes, and no app updates to it. To use Babysitter, install the [latest release](https://github.com/${GITHUB_REPOSITORY}/releases/latest).

          Built from \`${REF}\`.
          EOF

      - name: Publish the release
        run: |
          args=(--title "$NAME" --target "$REF" --latest="$LATEST")
          case "$CHANNEL" in
            stable) args+=(--generate-notes) ;;
            nightly) args+=(--prerelease --generate-notes) ;;
            preview) args+=(--prerelease --notes-file "$RUNNER_TEMP/notes.md") ;;
          esac
          if [ -n "$PREVIOUS_TAG" ]; then
            args+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          ls -l assets
          gh release create "$TAG" "${args[@]}" assets/*

  homebrew:
    name: Homebrew cask
    needs: [resolve, publish]
    if: needs.resolve.outputs.channel == 'stable' && vars.HOMEBREW_TAP != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Write the cask
        run: |
          gh release download "$TAG" --pattern 'babysitter-darwin-*.zip' --dir zips
          arm=$(sha256sum zips/babysitter-darwin-arm64.zip | cut -d' ' -f1)
          intel=$(sha256sum zips/babysitter-darwin-x64.zip | cut -d' ' -f1)
          signature=$([ "$SIGNED" = "true" ] && echo signed || echo unsigned)
          mkdir -p tap/Casks
          node frontend/scripts/write-cask.mjs "$VERSION" "$arm" "$intel" "$signature" > tap/Casks/babysitter.rb

      - name: Push the cask
        working-directory: tap
        env:
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/babysitter.rb
          if git diff --cached --quiet; then
            echo "The cask is already at $TAG"
            exit 0
          fi
          git commit -m "Update babysitter to $VERSION"
          git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP}.git" HEAD
