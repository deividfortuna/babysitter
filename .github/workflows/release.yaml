name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  GORELEASER_CROSS_VERSION: v1.27.1

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker run --rm \
            -v "$PWD:/go/src/babysitter" \
            -w /go/src/babysitter \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            "ghcr.io/goreleaser/goreleaser-cross:${GORELEASER_CROSS_VERSION}" \
            release --clean

      - name: Snapshot build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          docker run --rm \
            -v "$PWD:/go/src/babysitter" \
            -w /go/src/babysitter \
            "ghcr.io/goreleaser/goreleaser-cross:${GORELEASER_CROSS_VERSION}" \
            release --clean --snapshot

      - name: Upload snapshot artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: babysitter-snapshot
          path: dist/*.tar.gz

  desktop:
    name: Desktop (${{ matrix.arch }})
    needs: cli
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            lipo: arm64
          - runner: macos-15-intel
            arch: x64
            lipo: x86_64
    defaults:
      run:
        working-directory: frontend
    env:
      ARCH: ${{ matrix.arch }}
      SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install
        run: npm ci

      - name: Set the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-snapshot.${GITHUB_RUN_NUMBER}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        if: env.SIGNED == 'true'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Choose the signature
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "BABYSITTER_ADHOC_SIGN=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BABYSITTER_SIGN_IDENTITY=$MAC_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
            {
              echo "APPLE_API_KEY=$key"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          fi

      - name: Make
        run: |
          for attempt in 1 2 3; do
            npm run make -- --arch="$ARCH" && exit 0
            echo "::warning::make failed on attempt $attempt"
            sleep 30
          done
          exit 1

      - name: Verify the app
        env:
          LIPO_ARCH: ${{ matrix.lipo }}
        run: |
          app="out/Babysitter-darwin-$ARCH/Babysitter.app"
          daemon="$app/Contents/Resources/daemon/babysitter"
          if [ ! -d "$app" ]; then
            echo "::error::make wrote no app at $app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(lipo -archs "$daemon")" = "$LIPO_ARCH"
          test "$("$daemon" --version)" = "babysitter version $VERSION"
          if [ "$SIGNED" = "true" ]; then
            spctl --assess --verbose=2 --type execute "$app"
            xcrun stapler validate "$app"
            test -f "$app/Contents/Resources/app-update.yml"
          else
            test ! -f "$app/Contents/Resources/app-update.yml"
          fi

      - name: Name the assets
        run: |
          mkdir -p out/release
          cp "out/make/dmg/$ARCH/Babysitter.dmg" "out/release/Babysitter-$VERSION-darwin-$ARCH.dmg"
          cp "out/make/zip/darwin/$ARCH/Babysitter-darwin-$ARCH-$VERSION.zip" "out/release/Babysitter-$VERSION-darwin-$ARCH.zip"
          cp "out/release/Babysitter-$VERSION-darwin-$ARCH.dmg" "out/release/babysitter-darwin-$ARCH.dmg"
          cp "out/release/Babysitter-$VERSION-darwin-$ARCH.zip" "out/release/babysitter-darwin-$ARCH.zip"
          ls -l out/release

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          for attempt in 1 2 3; do
            gh release upload "$GITHUB_REF_NAME" out/release/* --clobber && exit 0
            echo "::warning::upload failed on attempt $attempt"
            sleep 30
          done
          exit 1

      - name: Upload snapshot artifacts
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: babysitter-desktop-${{ matrix.arch }}
          path: frontend/out/release/*

  feed:
    name: Update feed
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - name: Check out
        if: env.SIGNED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        if: env.SIGNED == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Write the feed
        if: env.SIGNED == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --pattern "Babysitter-$VERSION-darwin-*.zip" --dir zips
          node frontend/scripts/write-feed.mjs "$VERSION" \
            "zips/Babysitter-$VERSION-darwin-arm64.zip" \
            "zips/Babysitter-$VERSION-darwin-x64.zip" > latest-mac.yml
          cat latest-mac.yml

      - name: Upload the feed
        if: env.SIGNED == 'true'
        run: |
          for attempt in 1 2 3; do
            gh release upload "$GITHUB_REF_NAME" latest-mac.yml --clobber && exit 0
            echo "::warning::upload failed on attempt $attempt"
            sleep 30
          done
          exit 1

  homebrew:
    name: Homebrew cask
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && vars.HOMEBREW_TAP != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Write the cask
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern 'babysitter-darwin-*.zip' --dir zips
          arm=$(sha256sum zips/babysitter-darwin-arm64.zip | cut -d' ' -f1)
          intel=$(sha256sum zips/babysitter-darwin-x64.zip | cut -d' ' -f1)
          signature=$([ "$SIGNED" = "true" ] && echo signed || echo unsigned)
          mkdir -p tap/Casks
          node frontend/scripts/write-cask.mjs "${GITHUB_REF_NAME#v}" "$arm" "$intel" "$signature" > tap/Casks/babysitter.rb

      - name: Push the cask
        working-directory: tap
        env:
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/babysitter.rb
          if git diff --cached --quiet; then
            echo "The cask is already at $GITHUB_REF_NAME"
            exit 0
          fi
          git commit -m "Update babysitter to ${GITHUB_REF_NAME#v}"
          git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP}.git" HEAD
